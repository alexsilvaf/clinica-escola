spring.application.name=clinica-escola-api
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# Evita consultas durante a serialização das respostas da API.
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Banco embarcado e DDL automático são habilitados somente nos perfis locais.
spring.datasource.embedded-database-connection=none
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
